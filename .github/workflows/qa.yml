
name: CATI QA

on:
  push:
    branches:
      - fix/optimized-test-runner

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cati-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    name: Run CATI QA Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      CI: "true"
      TEST_ENV: staging
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      AI_ENGINE_URL: ${{ secrets.AI_ENGINE_URL }}
      AI_ENGINE_WS_URL: ${{ secrets.AI_ENGINE_WS_URL }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required secrets
        shell: bash
        run: |
          for var in FRONTEND_URL BACKEND_URL AI_ENGINE_URL AI_ENGINE_WS_URL TEST_EMAIL TEST_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing GitHub Secret: $var"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run QA tests
        run: npm run test:qa-report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: reports/generated/qa-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
